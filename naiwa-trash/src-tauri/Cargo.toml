[package]
name = "naiwa-trash"
version = "0.1.5"
edition = "2021"
rust-version = "1.90"

[lib]
name = "naiwa_trash"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2.9"
atomic-write-file = "0.3.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemServices"] }

# Compile-time dylibs must retain their Mach-O alignment on Xcode 27.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
strip = "none"

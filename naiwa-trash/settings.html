<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>奶蛙回收站 · 设置</title></head>
<body><main>
<header><img src="./pet/frames/mouth/00.png" alt=""><div><h1>奶蛙回收站</h1><p>清理一下，放个屁。</p></div></header>
<form id="preferences">
<section class="card">
<label class="toggle-row" for="cleanup-enabled"><span>自动清理</span><span class="toggle"><input id="cleanup-enabled" type="checkbox"><span class="toggle-track"></span></span></label>
<div class="rule">
<label class="field-label" for="cleanup-method">什么时候清理？</label>
<select id="cleanup-method"><option value="interval_hours">每隔一段时间</option><option value="item_limit">废纸篓装够文件</option><option value="size_limit_mib">废纸篓达到容量</option></select>
<div class="threshold"><span id="threshold-prefix">每隔</span><input id="threshold" type="number" inputmode="decimal" required><span id="threshold-unit">小时</span></div>
</div>
<p class="scope">清理会永久清空整个系统废纸篓。</p>
<button type="submit" id="save" class="primary" disabled>保存设置</button>
</section>
</form>
<div class="quick-actions"><button id="open-trash">看看废纸篓 ↗</button><button id="clean-now">现在清理 · 放屁</button></div>
<p id="feedback" role="status" aria-live="polite"></p>
</main><script type="module" src="/src/settings.js"></script></body></html>

<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>奶蛙 · 放屁预览</title><link rel="stylesheet" href="./src/laugh-preview.css"><link rel="stylesheet" href="./src/fart-preview.css"></head>
<body><main>
<p class="eyebrow">奶蛙回收站</p><h1>奶蛙要放屁啦。</h1>
<p class="intro">调整文件数量，看看放屁时间怎么变化。</p>
<div class="stage"><canvas id="gas" aria-hidden="true"></canvas><img id="pet" alt="奶蛙放屁预览" draggable="false"></div>
<label class="count">清理数量 <input id="items" type="number" min="1" step="1" inputmode="numeric"> 项</label>
<p id="duration"></p>
<div class="controls"><button id="play" disabled>准备声音中…</button><button id="stop" disabled>停止</button></div>
<p id="feedback" role="status" aria-live="polite"></p>
</main><script type="module" src="./src/fart-preview.js"></script></body></html>
